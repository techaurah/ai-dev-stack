<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b2335;
        --ground-2: #102b3e;
        --ink: #ffffff;
        --accent: #16c8e8;
        --font-display: "Inter", "Segoe UI", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        background: radial-gradient(ellipse at 50% 38%, var(--ground-2) 0%, var(--ground) 72%);
      }
      #scene {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #bar {
        width: 120px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
        margin-bottom: 34px;
      }
      #title {
        color: var(--ink);
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      #title .accent {
        color: var(--accent);
      }
      #sub {
        color: rgba(255, 255, 255, 0.78);
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1280"
      data-height="720"
    >
      <div id="scene" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="bar"></div>
        <h1 id="title">Tech<span class="accent">Aura</span></h1>
        <p id="sub">AI &amp; Software Engineering</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#bar",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        "#title",
        { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        0.45
      );
      tl.fromTo(
        "#sub",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
        0.9
      );
      tl.to({}, { duration: 2.2 }, 1.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
